  <path d="M18 15C18 13.3431 19.3431 12 21 12H27C28.6569 12 30 13.3431 30 15V17H18V15Z" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85"/>

